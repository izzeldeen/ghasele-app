org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compiler runs in its own JVM, separate from the Gradle daemon above. Without an
# explicit heap it picks a default that fails to start when the machine is already under memory
# pressure - which surfaces as "Could not connect to Kotlin compile daemon" and a silent fallback
# to slower in-process compilation.
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true
